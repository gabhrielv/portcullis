[project]
name = "aduana"
version = "0.1.0"
requires-python = ">=3.12"
# Vazio de propósito: o container do analisador instala `pip install .` e roda
# só com a biblioteca padrão. Quem fala com AWS e GitHub pede o extra `nuvem`.
dependencies = []

[project.optional-dependencies]
nuvem = [
    "boto3>=1.34",
    "requests>=2.31",
    "PyJWT[crypto]>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Mesma versão do docker/analisador.Dockerfile.
    "semgrep==1.172.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: precisa de rede ou de repositório local (desmarcado por padrão)",
]
addopts = "-m 'not integracao'"

[tool.ruff]
line-length = 100
