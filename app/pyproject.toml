[project]
name = "portcullis"
version = "0.1.0"
requires-python = ">=3.12"
# Vazio de propósito: cada perfil abaixo instala só o que usa.
dependencies = []

[project.optional-dependencies]
# O container fala com o S3, nunca com o GitHub.
analisador = [
    "boto3>=1.34",
]
nuvem = [
    "boto3>=1.34",
    "requests>=2.31",
    "PyJWT[crypto]>=2.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # A credencial do `aws login` (sessão do console) só é lida pelo boto3 com
    # o CRT. Fica em `dev` de propósito: o awscrt é grande e a Lambda não
    # precisa dele — lá a credencial vem da role, pelo provider padrão.
    "botocore[crt]",
    # Mesma versão do docker/analisador.Dockerfile.
    "semgrep==1.172.0",
    # O gabarito do corpus. Vem de carona no semgrep hoje, e é por isso que
    # está declarado: dependência transitiva some sem aviso.
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: precisa de rede ou de repositório local (desmarcado por padrão)",
]
addopts = "-m 'not integracao'"

[tool.ruff]
line-length = 100

# Sem isto o ruff não reconhece `portcullis` como pacote do projeto quando roda
# sobre `scripts/`, e junta os imports dele com os de terceiros.
[tool.ruff.lint.isort]
known-first-party = ["portcullis"]
