# Fonte única do corpus. Cada entrada gera contexto.json e achados.json.
#
# `alvo` é o achado que está sendo julgado. Ele nomeia a REGRA além do
# arquivo e da linha: uma linha costuma acumular achados sobrepostos de regras
# diferentes, e sem a regra o corpus mediria um achado diferente do pretendido
# conforme a ordem em que o semgrep os cospe.
#
# `linhas_tocadas` é o que o PR fictício alterou; é o que separa novo de
# pré-existente, exatamente como em produção.
#
# `evidencia_aceita` é a LISTA de evidências que contam como raciocínio certo.
# O veredito é um bit e não distingue acertar de acertar por acaso: em
# `sqli-constante` o modelo pode silenciar apontando uma "sanitização" no
# arquivo do Enum, que existe, passa no `prova_valida` e não sanitiza nada.
# É lista porque há caso com duas leituras honestas — e escrever a lista
# obriga a decidir quais são. `prova_em` compara só o arquivo: exigir a linha
# exata seria frágil.
#
# `arma_falso_negativo` marca o caso que consegue enganar o modelo a
# silenciar. Nos outros, bloquear é o padrão do portão e não mede o agente.
#
# Os caminhos são relativos à RAIZ DO REPOSITÓRIO, não à pasta do caso: a
# pasta `codigo/repo/` vira o topo do tarball e some na extração, do mesmo
# jeito que o prefixo `owner-repo-sha/` que o GitHub coloca.
#
# TODO ALVO É DE FLUXO DE DADOS. Achado de credencial no código e de cripto
# fraca saiu daqui em 18/08/2026: as duas perguntas do agente — de onde vem o
# valor, foi sanitizado — não se aplicam a eles, e a resposta honesta a "isso
# vem de fora?" num literal é "não", que silenciaria a credencial. Quem barra
# isso agora é `investigavel()` na regra, por CWE. Os casos viraram teste da
# lista em test_regra.py, não medida do agente.
#
# QUATRO REGRAS DISPARAM NOS DOIS LADOS DO GABARITO, de propósito:
#
#   sqlalchemy-execute-raw-query      7 reais, 3 falso-positivos
#   subprocess-shell-true             1 real,  1 falso-positivo
#   avoid-pickle                      1 real,  2 falso-positivos
#   explicit-unescape-with-markup     1 real,  1 falso-positivo
#
# O id da regra não carrega sinal. Um agente que decidisse pelo nome da regra
# tiraria 50%.

