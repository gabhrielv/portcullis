# ===========================================================================

- id: sqli-constante
  padrao: concatenacao-com-constante
  dificuldade: media
  gabarito: FALSO_POSITIVO
  alvo:
    arquivo: app/relatorio.py
    linha: 12
    regra: python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
  linhas_tocadas:
    app/relatorio.py: [[6, 12]]
  evidencia_aceita:
    - {entrada_controlavel: nao}
  motivo: >
    o valor vem de um Enum interno, sem qualquer entrada externa. A regra que
    disparou não faz taint analysis — ela marca toda execução de SQL cru.
    Só `entrada_controlavel: nao` conta: silenciar por "sanitização" aqui é
    apontar para uma linha que existe e não sanitiza nada

- id: sanitizacao-distante
  padrao: sanitizacao-a-distancia
  dificuldade: dificil
  gabarito: FALSO_POSITIVO
  alvo:
    arquivo: app/db.py
    linha: 7
    regra: python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
  linhas_tocadas:
    app/db.py: [[4, 8]]
  evidencia_aceita:
    - {entrada_controlavel: sim, sanitizacao_encontrada: sim, prova_em: app/middleware.py}
  motivo: >
    validar_id() roda como before_request e aborta com 400 se o id não for
    numérico. São três saltos até lá: db.py -> servico.py -> rotas.py. É o par
    exato do sqli-via-chamador, com a resposta oposta — e é o único caso do
    corpus que só fecha pela via da sanitização

- id: shell-true-com-comando-fixo
  padrao: shell-sem-entrada-externa
  dificuldade: media
  gabarito: FALSO_POSITIVO
  alvo:
    arquivo: app/versao.py
    linha: 13
    regra: python.lang.security.audit.subprocess-shell-true.subprocess-shell-true
  linhas_tocadas:
    app/versao.py: [[6, 15]]
  evidencia_aceita:
    - {entrada_controlavel: nao}
  motivo: >
    shell=True dispara a regra, mas todas as partes do comando são literais de
    uma constante do módulo. Mesma regra do command-injection, onde o host vem
    da requisição. A docstring justifica o shell=True com "herdar o PATH", que
    é FALSO — subprocess resolve o PATH com ou sem shell. É de propósito: o
    argumento plausível e errado é ruído que o agente tem que ignorar, porque
    quem prova o caso é a constante, não o comentário

- id: pickle-de-arquivo-proprio
  padrao: desserializacao-de-dado-proprio
  dificuldade: media
  gabarito: FALSO_POSITIVO
  alvo:
    arquivo: app/indice.py
    linha: 20
    regra: python.lang.security.deserialization.pickle.avoid-pickle
  linhas_tocadas:
    app/indice.py: [[12, 21]]
  evidencia_aceita:
    - {entrada_controlavel: nao}
  motivo: >
    o único produtor do arquivo é gravar_indice(), no mesmo módulo. O diretório
    não é servido, não recebe upload e não é alcançável por requisição.
    É o último caso do corpus que se fecha por prova de NEGATIVA — "nada mais
    escreve ali" —, e por isso é o candidato natural à variante de escala

- id: markup-com-inteiro
  padrao: sanitizacao-que-a-regra-nao-conhece
  dificuldade: media
  gabarito: FALSO_POSITIVO
  alvo:
    arquivo: app/carrinho.py
    linha: 13
    regra: python.flask.security.xss.audit.explicit-unescape-with-markup.explicit-unescape-with-markup
  linhas_tocadas:
    app/carrinho.py: [[8, 14]]
  evidencia_aceita:
    - {entrada_controlavel: nao}
    - {entrada_controlavel: sim, sanitizacao_encontrada: sim, prova_em: app/carrinho.py}
  motivo: >
    int() levanta ValueError em qualquer coisa que não seja número, então o que
    chega no Markup só pode ser dígito. A lista de sanitizadores da regra
    conhece escape() e render_template(), e não conhece int().
    Duas leituras honestas, as duas aceitas: "o que chega já é dígito, ninguém
    escolhe o conteúdo" e "vem da requisição, e o int() é a sanitização"

# ===========================================================================
# ESCALA GRANDE (4)
#
# O mesmo alvo, o mesmo gabarito e a mesma evidência aceita dos casos acima,
# com o código enterrado num palheiro de 150 arquivos inertes gerado pelo
# `palheiro.py`. Nas árvores pequenas a janela grátis de ±20 linhas cobre o
# arquivo do alvo INTEIRO, nos 18 casos: elas medem julgamento e não medem
# navegação. Medido em 18/08/2026 na variante grande: `buscar("validar")`
# estoura o teto de 50 resultados e `buscar("validar_id")` devolve 3 — o agente
# passa a ter que escolher o termo, que é o trabalho que o PASSOS_MAX = 8
# existe para limitar.
#
# Os quatro escolhidos são os que dependem de percorrer caminho ou de provar
# ausência. O resto do corpus não fica mais difícil com palheiro, só mais
# lento de congelar.
# ===========================================================================

