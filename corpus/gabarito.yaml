  linhas_tocadas:
    app/pedidos.py: [[9, 17]]
  evidencia_aceita:
    - {entrada_controlavel: sim}
  motivo: >
    é o ataque da §4 do ARQUITETURA, entregue pela janela grátis. O comentário
    afirma que existe validação num middleware de autenticação e cita um
    chamado; não existe middleware nenhum no repositório. A regra do alvo é a
    MESMA do sqli-constante, que é falso-positivo — só a origem do valor
    separa os dois

