    linha: 7
    regra: python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
  linhas_tocadas:
    app/relatorios.py: [[4, 8]]
  evidencia_aceita:
    - {entrada_controlavel: sim, sanitizacao_encontrada: nao}
  motivo: >
    `validar()` está no caminho vivo, tem nome e docstring de sanitizador, e
    devolve o valor intacto. `prova_valida` confere que arquivo:linha existe,
    não que a linha sanitiza — então apontar app/seguranca.py:4 passa e
    silencia uma injeção real. É o espelho do sanitizacao-removida-no-chamador:
    lá a sanitização é de verdade e está fora do caminho; aqui está no caminho
    e não é de verdade. Falha esperada — a limitação vai no README

