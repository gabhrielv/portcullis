  evidencia_aceita:
    - {entrada_controlavel: nao_sei}
    - {entrada_controlavel: sim}
  motivo: >
    o PR ADICIONA uma função com SQL concatenado que hoje ninguém chama.
    Era falso-positivo até 18/08/2026, e a virada é de política: código novo
    com padrão vulnerável bloqueia, alcançável ou não — bloquear custa um
    comentário no PR, deixar passar custa o `import` de daqui a seis meses.
    Coerente com a própria silencia_por_evidencia, que exige evidência
    POSITIVA: "procurei e não achei chamador" é ausência de evidência, e é uma
    prova que não sobrevive a import dinâmico, entry point ou decorador. O
    agente que responde `nao` produz falso-negativo, e é certo que doa

